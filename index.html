
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Voice From My Heart ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    background: linear-gradient(135deg,#f8f0e5,#e8d2b7,#fffaf2);
    font-family: Georgia,serif;
}

.card {
    max-width: 430px;
    width: 100%;
    padding: 40px 25px;
    text-align: center;
    background: #fffdf8;
    border: 1px solid #c5a16c;
    border-radius: 25px;
    box-shadow: 0 15px 40px #92765730;
}

h1 {
    color: #805b46;
}

p {
    color: #9b795d;
    line-height: 1.9;
    font-size: 17px;
}

.heart {
    font-size: 45px;
    margin: 20px;
}

audio {
    width: 100%;
    margin: 25px 0;
}

.footer {
    color: #b08a62;
    margin-top: 25px;
}
</style>
</head>

<body>

<div class="card">

    <div class="heart">🤎 🎀 🤎</div>

    <h1>Heyyy My Azhagiii!</h1>

    <p>
        This is not just a voice note.
        It's a little piece of my heart,
        specially kept for you.
    </p>

    <p>
        Close your eyes, listen carefully
        and feel every word. ❤️
    </p>

    <audio controls>
        <source src="voice.mp4" type="audio/mp4">
        Your browser does not support audio.
    </audio>

    <h2 style="color:#a67c52">
        Happy Birthday, My Love! ❤️
    </h2>

    <div class="footer">
        Forever Yours,<br>
        Your Karumbeyy 🦚
    </div>

</div>

</body>
</html>
